name: Atualizar drops

on:
  schedule:
    # O GitHub NAO honra */10 em repo gratuito: medido em 25/08/2026, os
    # disparos reais sairam com 40-52 min de intervalo. O cron fica curto de
    # proposito, mas nao conte com 10 minutos.
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    # `checker.py` entrou aqui em 25/08/2026: consertei a fonte que estava
    # morta e o dado novo so ia ao ar no proximo cron — quase uma hora depois,
    # com o dono olhando o site vazio.
    paths:
      - "jogos-fora.txt"       # mexeu na lista de jogos, limpa o radar na hora
      - "checker.py"           # mexeu no coletor, recolhe tudo de novo
      - ".github/workflows/update-drops.yml"
  workflow_dispatch: {}       # botão "Run workflow" pra rodar na hora

permissions:
  contents: write

concurrency:
  group: update-drops
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar drops
        run: python checker.py

      - name: Commitar dados
        run: |
          git config user.name "drops-bot"
          git config user.email "drops-bot@users.noreply.github.com"
          git add data/drops.json
          git diff --staged --quiet || git commit -m "drops $(date -u +%FT%TZ)"
          git push
